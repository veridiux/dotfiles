general {
	lock_cmd = hyprlock
	before_sleep_cmd = hyprlock
}

# Dim display
listener {
	timeout = 300
	on-timeout = brightnessctl -d amdgpu_bl1 set 30%
	on-resume = brightnessctl -d amdgpu_bl1 set 100%
}

# Turn off display
listener {
	timeout = 600
	on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
	on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Turn off keyboard
listener {
        timeout = 600
        on-timeout = brightnessctl -d asus::kbd_backlight set 0%
        on-resume = brightnessctl -d asus::kbd_backlight set 80%
}


# Lock display
listener {

}
