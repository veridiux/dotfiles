# ============================================================
# FUTURISTIC ORANGE // KITTY
# ============================================================

# ------------------------------------------------------------
# Window
# ------------------------------------------------------------

background_opacity 0.82
dynamic_background_opacity yes

window_padding_width 12
hide_window_decorations yes


# ============================================================
# Font
# ============================================================

font_family      JetBrainsMono Nerd Font
font_size        8.0
bold_font        auto
italic_font      auto
bold_italic_font auto


# ============================================================
# COLORS
# ============================================================

# Deep HUD background
background #080808

# Main text
foreground #d7d7d7

# Cursor
cursor #ff6200
cursor_text_color #080808


# ------------------------------------------------------------
# ANSI COLORS
# ------------------------------------------------------------

color0  #080808
color1  #ff4d00
color2  #7cff00
color3  #ff9d00
color4  #ff6200
color5  #ff7a18
color6  #ffb347
color7  #d7d7d7

color8  #71665d
color9  #ff5c1a
color10 #9cff3b
color11 #ffb52e
color12 #ff6200
color13 #ff8c32
color14 #ffc266
color15 #f2f2f2


# ============================================================
# SELECTION
# ============================================================

selection_foreground #080808
selection_background #ff6200


# ============================================================
# LINKS
# ============================================================

url_color #ff6200
url_style curly


# ============================================================
# TABS
# ============================================================

active_tab_foreground   #080808
active_tab_background   #ff6200

inactive_tab_foreground #77706a
inactive_tab_background #16120f


# ============================================================
# BELL
# ============================================================

bell_border_color #ff6200
bell_on_tab yes


# ============================================================
# CURSOR
# ============================================================

cursor_shape block
cursor_blink_interval 0.7